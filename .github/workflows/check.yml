# Thin wrapper on purpose: every check lives in package.json scripts
# (`pnpm check`), so CI logic is the same everywhere it runs.
name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      # Third-party actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The real malware scanner, separately: installing ClamAV and downloading its
  # signature database takes a few minutes, and the main check stays fast.
  scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: sudo apt-get update && sudo apt-get install --yes clamav
      - run: sudo systemctl stop clamav-freshclam || true
      - run: sudo freshclam
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tools/scanner-integration.mjs

  # The browser validator, in real Chromium, Firefox, and WebKit: every
  # conformance fixture must get the same verdict as in Node.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The browsers need about 100 system packages from the runner's Ubuntu
      # mirror, which has stalled long enough to use up the whole job. Keep
      # apt's downloads and the browsers between runs, per runner image and
      # Playwright version, and retry a stalled install instead of waiting.
      # ImageOS and ImageVersion are set on the runner machine, which the
      # env context cannot see, so a step reads them.
      - id: playwright
        run: |
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm --filter @automatethecloud/openwaymark-web-validator exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - run: |
          mkdir -p ~/apt-archives/partial
          printf '%s\n' "Dir::Cache::Archives \"$HOME/apt-archives\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' |
            sudo tee /etc/apt/apt.conf.d/90-keep-downloads
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/apt-archives
            ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ steps.playwright.outputs.image }}-
      - run: |
          for attempt in 1 2 3; do
            timeout 480 pnpm --filter @automatethecloud/openwaymark-web-validator exec playwright install --with-deps chromium firefox webkit && exit 0
            echo "Install attempt $attempt failed or took over 8 minutes; trying again."
          done
          exit 1
      # apt runs as root; let the cache step read what it downloaded.
      - run: sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
      - run: pnpm test:browser
