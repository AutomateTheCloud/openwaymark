flashcards:
  - id: term-mitosis
    front:
      text: Mitosis
    back:
      text: Cell division that produces two genetically identical daughter cells.
    tags: [cells]

  - id: term-meiosis
    front:
      text: Meiosis
    back:
      text: |
        Cell division that produces four cells, each with half the original
        number of chromosomes. It produces gametes (sex cells).
    hint:
      text: Think about how egg and sperm cells are made.
    tags: [cells]

  - id: term-osmosis
    front:
      text: Osmosis
    back:
      text: |
        The movement of water across a selectively permeable membrane, from
        lower solute concentration to higher solute concentration.
    tags: [transport]

  - id: term-diffusion
    front:
      text: Diffusion
    back:
      text: |
        The net movement of particles from an area of higher concentration to an
        area of lower concentration.
    tags: [transport]

  - id: term-photosynthesis
    front:
      text: Photosynthesis
    back:
      text: |
        The process by which plants and some other organisms use light energy to
        make glucose from carbon dioxide and water, releasing oxygen.
    tags: [energy]
